root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/aeroduct-api ./cmd/api/main.go"
  bin = "./tmp/aeroduct-api"
  delay = 1000
  exclude_dir = ["tmp", "bin", "vendor", "testdata"]
  include_ext = ["go", "tpl", "tmpl", "html"]
  exclude_regex = ["_test\\.go"]
  kill_delay = "0.5s"
  send_interrupt = true

[color]
  build    = "yellow"
  runner   = "green"
  watcher  = "cyan"
  main     = "magenta"

[log]
  time = true

[misc]
  clean_on_exit = true
