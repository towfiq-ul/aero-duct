version: "3.9"

services:
  # ── PostgreSQL ──────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    container_name: aeroduct-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aeroduct_dev
      POSTGRES_USER: aeroduct
      POSTGRES_PASSWORD: aeroduct
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aeroduct -d aeroduct_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── PgAdmin (optional UI) ───────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: aeroduct-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@aeroduct.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools

volumes:
  postgres_data:
    name: aeroduct_postgres_data
